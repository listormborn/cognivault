# ═══════════════════════════════════════════════════════════════════════════
# ⚠️ ФАЙЛ УСТАРЕЛ. Актуальный набор манифестов — deploy/dropapp/
# (см. deploy/dropapp/README.md): полный набор с бэкендом, Service, Ingress и
# актуальным пином образа — он там один, и сверять надо с ним. Здесь нет
# ни бэкенда, ни Ingress-объекта.
# Файл оставлен для истории и отката — не применять, не сверившись с deploy/dropapp/.
# ═══════════════════════════════════════════════════════════════════════════
#
# ВНИМАНИЕ: /data смонтирован как emptyDir — БЕЗ PVC (в namespace квота на PVC
# и тома не биндятся, ровно как у cognivault: users.json и векторов Qdrant).
# Это значит: история чатов (JSON под /data) НЕ переживёт перезапуск/перепланировку
# пода — она теряется вместе с emptyDir. Для функционального теста этого достаточно;
# для постоянства нужен PVC (поднять квоту у платформы, затем заменить том `data`
# на persistentVolumeClaim — изменений в коде не требуется, тот же mountPath /data).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cognivault-ui-config
data:
  COGNIVAULT_UI_MODE: "server"
  COGNIVAULT_BASE_URL: "http://cognivault:3000"
  UI_PORT: "8787"
  UI_DATA_DIR: "/data"
  # Уровень логов самого приложения (логгеры cognivault-ui.*). INFO показывает
  # второй проход грейдера, пропущенные фрагменты и query_id KitAI — без этого
  # деградация конвейера в логе пода не видна. DEBUG на время разбора инцидента.
  UI_LOG_LEVEL: "INFO"
  GIGACHAT_BASE_URL: "https://gigachat-ift.sberdevices.delta.sbrf.ru/v1"
  GIGACHAT_MODEL: "GigaChat-3-Ultra-preview"
  GIGACHAT_CERT_PATH: "/certs/client_crt.crt"
  GIGACHAT_KEY_PATH: "/certs/client_key.key"
  GIGACHAT_VERIFY_SSL: "false"
  GIGACHAT_TEMPERATURE: "0.2"
  GIGACHAT_MAX_TOKENS: "4096"
  GIGACHAT_MODEL_CONTEXT_TOKENS: "32768"
  # ── Транспорт чата ──
  # "gigachat" — прямой mTLS-клиент, настоящий стриминг токенов (путь отката);
  # "kitai"    — платформа KitAI: POST → polling → commit, стриминга НЕТ.
  # Эмбеддинги этим ключом не затрагиваются: они считаются в TS-бэкенде своим
  # провайдером, и смена эмбеддера означала бы полную переиндексацию.
  CHAT_PROVIDER: "kitai"
  # Без /v1 — версия зашита в пути (/api/v1/query/...).
  KITAI_HOST: "https://hcscr-ift.delta.sbrf.ru"
  # 2026-09-02: платформа отвечает на glm-5.1 «404 No such model». Рабочее имя
  # выставляется в UI (Модель → kitai_model) и живёт в config.json пользователя
  # на emptyDir, то есть ПОСЛЕ КАЖДОГО ПЕРЕЗАПУСКА ПОДА его надо выставить заново,
  # пока сюда не вписано живое имя. Список моделей: /api/config/models или
  # deploy/dropapp/kitai-check.py.
  KITAI_MODEL: "glm-5.1"
  # Уезжает в x-identification-system / x-identification-module.
  KITAI_SYSTEM_NAME: "csp_lab"
  KITAI_MODULE_NAME: "csp_lab_antifraud_edge"
  KITAI_PROFANITY_CHECK: "false"
  # Дополнительные поля запроса к платформе (JSON-объект), например выключить
  # режим рассуждений модели без пересборки образа. Только добавляет ключи —
  # query_id/model_name/messages перекрыть нельзя. Кривой JSON → WARNING и
  # игнор, чат не падает. Ключи попадают в лог (INFO), значения — никогда.
  # KITAI_EXTRA_BODY: '{"enable_thinking": false}'
  # Отдельный клиентский сертификат KitAI: он живёт на другом контуре, и общая
  # с GigaChat пара — частный случай, а не правило.
  #
  # Порядок выкатки НЕ критичен: если секрет `cognivault-kitai-certs` ещё не
  # заведён, том смонтируется пустым, приложение возьмёт сертификат GigaChat и
  # напишет об этом WARNING в лог пода. Чат при этом работает. Проверить, какой
  # сертификат взят фактически, — `deploy/dropapp/kitai-check.py`.
  KITAI_CERT_PATH: "/certs/kitai/client_crt.crt"
  KITAI_KEY_PATH: "/certs/kitai/client_key.key"
  # Бюджет ОЖИДАНИЯ ответа, не таймаут сокета: запрос стоит в очереди, а мы
  # опрашиваем результат. Скрытые вызовы (condense/грейдер) режут его своими
  # поводками в 10 и 20 с.
  KITAI_POLL_TIMEOUT: "240"
  KITAI_POLL_INITIAL_DELAY: "2"
  KITAI_POLL_DELAY: "2"
  RAG_MODE: "auto"
  # Волна 0 (фидбек 2026-08-26): окно секции 4000 → 12000, бюджет 24000 → 48000.
  # 44 секции из 260 длиннее старого окна и держат 70.6% текста базы; полные
  # перечисления (модели без финэффекта, параметры конфигурации, реестры) в
  # окно 4000 не помещались физически. Обе ручки правятся из UI без редеплоя.
  RAG_MAX_CONTEXT_CHARS: "48000"
  RAG_FILE_FULL_CHARS: "6000"
  RAG_SECTION_MAX_CHARS: "12000"
  RAG_MAX_EXPANDED_FILES: "2"
  RAG_LIMIT: "10"
  RAG_SOURCE: "hybrid"
  # Волна 2: два скрытых вызова GigaChat (интент+condense, батч-грейдер).
  RAG_CONDENSE_ENABLED: "true"
  RAG_GRADER_ENABLED: "true"
  # Поводки скрытых вызовов (переформулировка вопроса и грейдер). Дефолты в коде
  # — 10 и 20 с — подобраны под стриминговый GigaChat, который начинает отвечать
  # сразу. KitAI ставит запрос в очередь и опрашивает результат: минимум ~4 с
  # даже вхолостую, а под нагрузкой заметно больше. С 20 с грейдер отваливался
  # по таймауту на КАЖДОМ ходе — отбор фрагментов не работал вовсе, и в логе это
  # выглядело как «grader: вызов не удался ()».
  # Цена подъёма: скрытые вызовы блокируют ответ, то есть худший случай ожидания
  # растёт. На KitAI стриминга всё равно нет, ждать приходится в любом случае.
  RAG_CONDENSE_TIMEOUT: "45"
  RAG_GRADER_TIMEOUT: "90"
  # Бюджет ВЫВОДА скрытых вызовов (был зашит: 1024 и 512). Рассуждающая модель
  # (qwen в режиме thinking) тратит тот же max_tokens сначала на рассуждения —
  # на JSON не оставалось ничего: «GigaChat вернул пустой ответ»,
  # finish_reason=length, реранкер мёртв на каждом ходе. Значения совпадают с
  # дефолтами кода (`app/config.py`) — за этим следит тест.
  RAG_GRADER_MAX_TOKENS: "4096"
  RAG_CONDENSE_MAX_TOKENS: "2048"
  RAG_GRADER_THRESHOLD: "4"
  # Волна 0: 2 → 0. Добор двух верхних по сырому рангу шёл в контекст мимо
  # грейдера, даже с оценкой 1 — это 40% контекста без фильтрации, и именно
  # оттуда брались лишние пункты в ответах.
  RAG_GRADER_KEEP_TOP: "1"
  # Запускать вызов 1 (интент + condense) и на ПЕРВОЙ реплике диалога: без него
  # первый ход не классифицируется вовсе (истории нет — condense коротит), и поле
  # охвата document/corpus на первом сообщении отсутствует. Цена — +1 вызов
  # GigaChat на первое сообщение каждого диалога. Выключено по умолчанию.
  RAG_CONDENSE_FIRST_TURN: "false"
  # Волна 3: ширина ретрива 20 → 40. Грейдер батчится по 12, поэтому 40 кандидатов
  # дают ЧЕТЫРЕ вызова оценки вместо двух (~x2 к стоимости этапа, латентность та же
  # — батчи идут одной параллельной волной). Правится из UI, если нужно вернуть 20.
  RAG_RERANK_CANDIDATES: "40"
  # Итерация 3, шаг 3: дерево разделов базы из GET /api/vault/catalog вместо
  # короткого блока «состав базы». Ноль вызовов модели.
  #
  # ВКЛЮЧЕНО для этой установки: вольт наполняется синхронизацией Confluence, и
  # его иерархия папок И ЕСТЬ дерево продуктов. В коде дефолт остаётся false —
  # на вольте вида 2024/Q1/заметки дерево превращается в календарь.
  #
  # Цена и режимы отказа:
  #  * ~3 400 токенов в КАЖДОМ ходе против ~199 у короткого блока «состав базы».
  #    Платит история диалога: длинные переписки теряют ранние ходы раньше.
  #  * Требует GET /api/vault/catalog — маршрут появился в бэкенде этого же
  #    релиза. Старый образ бэкенда + этот ключ = головного блока НЕТ ВООБЩЕ.
  #  * Каталог недоступен — головной блок исчезает молча: ни дерева, ни короткого
  #    блока (определение «что считать документом» тоже приходит из каталога).
  #    Сделано намеренно, но проблема бэкенда выглядит как более скупой ответ,
  #    а не как ошибка.
  RAG_CORPUS_TREE_ENABLED: "true"
  RAG_INCLUDE_ARCHIVED: "true"
  # Источник Confluence: проверка TLS сервера СНЯТА (verify=false) — временный режим,
  # пока нет внутреннего CA-бандла Сбера. В этом режиме CONFLUENCE_CA_PATH и ConfigMap
  # `sber-ca` игнорируются (монтирование остаётся, но не используется).
  # Когда появится реальный PEM в ConfigMap `sber-ca` — верните "true".
  CONFLUENCE_VERIFY_SSL: "false"
  CONFLUENCE_CA_PATH: "/certs/sber-ca.pem"
---
# cognivault-ui — /data на emptyDir, БЕЗ PVC (см. предупреждение вверху файла).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognivault-ui
  labels:
    app.kubernetes.io/name: cognivault-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cognivault-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognivault-ui
    spec:
      imagePullSecrets:
        - name: sberosc-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cognivault-ui
          # Иммутабельный sha-тег свежей (Alpine, прошедшей скан) сборки. Пиним именно
          # sha, а не тег ветки, чтобы SberOSC отсканировал НОВЫЙ digest, а не отдал
          # закешированный вердикт «Заблокирован» по старому образу.
          # Образ тянется через прокси SberOSC из ghcr.io/listormborn/cognivault-ui
          # (пакет ghcr должен быть PUBLIC).
          # ВНИМАНИЕ: тег должен совпадать с deploy/dropapp/05-ui.yaml, и бэкенд катится
          # НЕ ПОЗЖЕ UI (см. комментарий у образа в cognivault.yaml).
          image: sberosc.sigma.sbrf.ru/ghcr.io/listormborn/cognivault-ui:sha-cb0fe90
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: cognivault-ui-config
          env:
            # Общий с cognivault секрет с mTLS-сертификатами GigaChat.
            - name: GIGACHAT_KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: cognivault-gigachat-certs
                  key: key.passphrase
                  optional: true
          volumeMounts:
            - name: gigachat-certs
              mountPath: /certs
              readOnly: true
            # Отдельный сертификат KitAI. Секрет `optional: true` — без него под
            # поднимается, и KitAI идёт сертификатом GigaChat.
            - name: kitai-certs
              mountPath: /certs/kitai
              readOnly: true
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: kitai-certs
          secret:
            secretName: cognivault-kitai-certs
            optional: true
            defaultMode: 0440
        - name: gigachat-certs
          secret:
            secretName: cognivault-gigachat-certs
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cognivault-ui
  labels:
    app.kubernetes.io/name: cognivault-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cognivault-ui
  ports:
    - name: http
      port: 8787
      targetPort: http
---
# ВНЕШНИЙ ДОСТУП: этот манифест НАМЕРЕННО не создаёт свой Ingress.
# Наружу выводим ТОЛЬКО UI — перенаправлением существующего oasis-cognivault-ingress
# с cognivault:3000 на cognivault-ui:8787. REST API при этом становится внутренним
# (ClusterIP-only): морде он доступен по http://cognivault:3000 внутри кластера,
# снаружи — нет. Отредактируйте oasis-cognivault-ingress:
#
#   spec:
#     rules:
#       - host: cognivault.apps.bcayrqks.k8s.delta.sbrf.ru
#         http:
#           paths:
#             - path: /
#               pathType: Prefix
#               backend:
#                 service:
#                   name: cognivault-ui     # было: cognivault
#                   port:
#                     number: 8787          # было: 3000
#
# ВНИМАНИЕ: TLS у текущего ingress не настроен (обычный HTTP) — cv-токены идут
# открытым текстом; при наличии серта добавьте spec.tls[].secretName.
# CA-бандл для TLS Confluence сейчас НЕ используется (CONFLUENCE_VERIFY_SSL=false),
# поэтому ConfigMap `sber-ca` и том sber-ca намеренно убраны — чтобы под не падал
# на отсутствующем ConfigMap. Когда появится реальный внутренний УЦ Сбера: верните
# ConfigMap `sber-ca` (data: sber-ca.pem: <PEM>), том sber-ca и volumeMount
# (subPath /certs/sber-ca.pem), и поставьте CONFLUENCE_VERIFY_SSL: "true".
---
# ОПЦИОНАЛЬНО — примените ТОЛЬКО если сервис-меш блокирует исходящий трафик по
# умолчанию (Istio outboundTrafficPolicy = REGISTRY_ONLY): тогда сайдкар режет
# вызовы к неизвестным хостам, и Confluence надо явно занести в реестр. Если меш
# в режиме ALLOW_ANY (дефолт Istio) или меша нет — этот объект не нужен (no-op).
#
# UI-под сам инициирует TLS к Confluence (проверяя серт по sber-ca выше). При
# protocol: TLS сайдкар делает SNI-passthrough и НЕ терминирует соединение — не
# добавляйте сюда DestinationRule, originating TLS для этого хоста.
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: confluence-egress
  labels:
    app.kubernetes.io/name: cognivault-ui
spec:
  hosts:
    - confluence.sberbank.ru
  ports:
    - number: 443
      name: https
      protocol: TLS
  resolution: DNS
  location: MESH_EXTERNAL
