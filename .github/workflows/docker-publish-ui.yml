name: Build and Publish CogniVault UI Docker Image

on:
  push:
    branches:
      - main
      - emdash/k8s-gigachat-integration-yce22
      - emdash/k8s-gigachat-integration-yce22-lida
    paths:
      - 'cognivault-ui/**'
      # Харнесс оценки едет в этом же образе (см. Dockerfile) — значит его
      # правки обязаны пересобирать UI, иначе в поде останется старая версия.
      - 'tools/eval/**'
      - '.github/workflows/docker-publish-ui.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Compile-check the UI app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r cognivault-ui/requirements.txt

      - name: Compile-check app
        run: python -m compileall cognivault-ui/app

  build-and-push:
    name: Build and push UI Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # NOTE: the resulting ghcr.io/coolcrazycool/cognivault-ui package must be
          # made PUBLIC so the SberOSC proxy (sberosc.sigma.sbrf.ru/ghcr.io/...) can
          # pull it without GHCR credentials.
          images: ghcr.io/coolcrazycool/cognivault-ui
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/coolcrazycool/cognivault
            org.opencontainers.image.description=CogniVault UI — chat frontend for the CogniVault knowledge layer

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Корень репозитория: Dockerfile тянет и cognivault-ui/, и tools/eval/.
          context: .
          file: ./cognivault-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
