# Несекретная конфигурация фронтенда (cognivault-ui, FastAPI + SPA).
# UI ходит в бэкенд по внутреннему Service (COGNIVAULT_BASE_URL) и в GigaChat —
# напрямую, тем же mTLS-сертификатом, что и бэкенд.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cognivault-ui-config
  labels:
    app.kubernetes.io/name: cognivault-ui
    app.kubernetes.io/component: ui
data:
  # ── Режим и адрес бэкенда ─────────────────────────────────────────────
  COGNIVAULT_UI_MODE: "server"
  # Обязательно должен указывать на существующий Service — он создаётся в
  # 04-backend.yaml (kind: Service, name: cognivault, port 3000).
  COGNIVAULT_BASE_URL: "http://cognivault:3000"
  # Адрес и порт, на которых слушает сам UI. UI_PORT обязан совпадать с
  # containerPort/targetPort в 05-ui.yaml (8787) и с портом бэкенда в
  # 06-ingress.yaml. UI_HOST — 0.0.0.0, иначе под недоступен извне контейнера.
  UI_HOST: "0.0.0.0"
  UI_PORT: "8787"
  # ВНИМАНИЕ: /data у UI — emptyDir (PVC в namespace нет ни одного).
  # История чатов и rag_log.jsonl НЕ переживают перезапуск пода.
  UI_DATA_DIR: "/data"
  # Уровень логов самого приложения (логгеры cognivault-ui.*). INFO показывает
  # второй проход грейдера, пропущенные фрагменты и query_id KitAI — без этого
  # деградация конвейера в логе пода не видна. DEBUG на время разбора инцидента.
  UI_LOG_LEVEL: "INFO"

  # ── Роли по существующим CogniVault-токенам ─────────────────────────
  # Пока false — историческое поведение: любой валидный токен считается admin.
  # Для включения сначала посчитайте SHA-256 админского токена (сам токен сюда
  # НЕ записывать), внесите хеш в UI_ADMIN_TOKEN_HASHES, затем поставьте true.
  # Несколько администраторов: хеши через запятую. Все остальные валидные токены
  # получают роль user: чат/история/источники/оценка ответа, без настроек,
  # Confluence, загрузки, eval и обслуживания индекса.
  UI_RBAC_ENABLED: "false"
  UI_ADMIN_TOKEN_HASHES: ""

  # ── GigaChat (генерация ответа) ───────────────────────────────────────
  GIGACHAT_BASE_URL: "https://gigachat-ift.sberdevices.delta.sbrf.ru/v1"
  GIGACHAT_MODEL: "GigaChat-3-Ultra-preview"
  # Тот же секрет cognivault-gigachat-certs, смонтированный в /certs.
  GIGACHAT_CERT_PATH: "/certs/client_crt.crt"
  GIGACHAT_KEY_PATH: "/certs/client_key.key"
  GIGACHAT_VERIFY_SSL: "false"
  GIGACHAT_TEMPERATURE: "0.2"
  GIGACHAT_MAX_TOKENS: "4096"
  GIGACHAT_MODEL_CONTEXT_TOKENS: "32768"
  # ── Транспорт чата ──
  # "gigachat" — прямой mTLS-клиент, настоящий стриминг токенов (путь отката);
  # "kitai"    — платформа KitAI: POST → polling → commit, стриминга НЕТ (UI
  # показывает «Модель думает…» вместо бегущего курсора).
  # Эмбеддинги этим ключом не затрагиваются: они считаются в TS-бэкенде своим
  # провайдером, и смена эмбеддера означала бы полную переиндексацию.
  CHAT_PROVIDER: "kitai"
  # Без /v1 — версия зашита в пути (/api/v1/query/...).
  KITAI_HOST: "https://hcscr-ift.delta.sbrf.ru"
  # 2026-09-02: платформа отвечает на glm-5.1 «404 No such model». Рабочее имя
  # выставляется в UI (Модель → kitai_model) и живёт в config.json пользователя
  # на emptyDir, то есть ПОСЛЕ КАЖДОГО ПЕРЕЗАПУСКА ПОДА его надо выставить заново,
  # пока сюда не вписано живое имя. Список моделей: /api/config/models или
  # deploy/dropapp/kitai-check.py.
  KITAI_MODEL: "glm-5.1"
  # Уезжает в x-identification-system / x-identification-module.
  KITAI_SYSTEM_NAME: "csp_lab"
  KITAI_MODULE_NAME: "csp_lab_antifraud_edge"
  KITAI_PROFANITY_CHECK: "false"
  # Дополнительные поля запроса к платформе (JSON-объект), например выключить
  # режим рассуждений модели без пересборки образа. Только добавляет ключи —
  # query_id/model_name/messages перекрыть нельзя. Кривой JSON → WARNING и
  # игнор, чат не падает. Ключи попадают в лог (INFO), значения — никогда.
  # KITAI_EXTRA_BODY: '{"enable_thinking": false}'
  # Отдельный клиентский сертификат KitAI: он живёт на другом контуре, и общая
  # с GigaChat пара — частный случай, а не правило.
  #
  # Порядок выкатки НЕ критичен: если секрет `cognivault-kitai-certs` ещё не
  # заведён, том смонтируется пустым, приложение возьмёт сертификат GigaChat и
  # напишет об этом WARNING в лог пода. Чат при этом работает. Проверить, какой
  # сертификат взят фактически, — `deploy/dropapp/kitai-check.py`.
  KITAI_CERT_PATH: "/certs/kitai/client_crt.crt"
  KITAI_KEY_PATH: "/certs/kitai/client_key.key"
  # Бюджет ОЖИДАНИЯ ответа, а не таймаут сокета: запрос стоит в очереди, а мы
  # опрашиваем результат. Скрытые вызовы (condense/грейдер) режут его своими
  # поводками в 10 и 20 с.
  KITAI_POLL_TIMEOUT: "240"
  KITAI_POLL_INITIAL_DELAY: "2"
  KITAI_POLL_DELAY: "2"

  # ── RAG-конвейер ──────────────────────────────────────────────────────
  RAG_MODE: "auto"
  RAG_MAX_CONTEXT_CHARS: "48000"
  RAG_FILE_FULL_CHARS: "6000"
  RAG_SECTION_MAX_CHARS: "12000"
  RAG_MAX_EXPANDED_FILES: "2"
  RAG_LIMIT: "10"
  RAG_SOURCE: "hybrid"
  # Порог косинусной близости, ниже которого найденное отбрасывается. НЕ задан —
  # то есть отсечки нет (в коде дефолт None): на гибридном поиске абсолютные
  # значения score несопоставимы между запросами, и фиксированный порог легко
  # выкидывает единственный релевантный фрагмент. Отбором занимается грейдер
  # ниже. Задавать только осознанно, значение в диапазоне 0.0–1.0.
  # RAG_MIN_SCORE: "0.3"
  # Волна 2: два скрытых вызова GigaChat (интент + condense, батч-грейдер).
  RAG_CONDENSE_ENABLED: "true"
  RAG_GRADER_ENABLED: "true"
  # Поводки скрытых вызовов (переформулировка вопроса и грейдер). Дефолты в коде
  # — 10 и 20 с — подобраны под стриминговый GigaChat, который начинает отвечать
  # сразу. KitAI ставит запрос в очередь и опрашивает результат: минимум ~4 с
  # даже вхолостую, а под нагрузкой заметно больше. С 20 с грейдер отваливался
  # по таймауту на КАЖДОМ ходе — отбор фрагментов не работал вовсе, и в логе это
  # выглядело как «grader: вызов не удался ()».
  # Цена подъёма: скрытые вызовы блокируют ответ, то есть худший случай ожидания
  # растёт. На KitAI стриминга всё равно нет, ждать приходится в любом случае.
  RAG_CONDENSE_TIMEOUT: "45"
  RAG_GRADER_TIMEOUT: "90"
  # Бюджет ВЫВОДА скрытых вызовов (был зашит: 1024 и 512). Рассуждающая модель
  # (qwen в режиме thinking) тратит тот же max_tokens сначала на рассуждения —
  # на JSON не оставалось ничего: «GigaChat вернул пустой ответ»,
  # finish_reason=length, реранкер мёртв на каждом ходе. Значения совпадают с
  # дефолтами кода (`app/config.py`) — за этим следит тест.
  RAG_GRADER_MAX_TOKENS: "4096"
  RAG_CONDENSE_MAX_TOKENS: "2048"
  RAG_GRADER_THRESHOLD: "4"
  RAG_GRADER_KEEP_TOP: "1"
  # Запускать вызов 1 (интент + condense) и на ПЕРВОЙ реплике диалога. Без него
  # первый ход не классифицируется вовсе: истории нет, condense коротит, и поле
  # охвата (document/corpus) на первом сообщении отсутствует. Цена ровно одна —
  # +1 вызов GigaChat на первое сообщение каждого диалога; переписывание вопроса
  # при этом игнорируется (переписывать нечего). Выключено по умолчанию.
  RAG_CONDENSE_FIRST_TURN: "false"
  # Итерация 3, шаг 3: дерево разделов базы из GET /api/vault/catalog вместо
  # короткого блока «состав базы». Ноль вызовов модели.
  #
  # ВКЛЮЧЕНО для этой установки: вольт наполняется синхронизацией Confluence, и
  # его иерархия папок И ЕСТЬ дерево продуктов — «какие витрины описаны в базе»
  # отвечается формой дерева, потому что ни один документ корпуса перечня
  # корпуса не содержит (страница «Продукты» существует и пуста). В коде дефолт
  # остаётся false: на вольте вида 2024/Q1/заметки дерево — это календарь.
  #
  # Что это стоит и чем ломается, по порядку:
  #  * ~3 400 токенов в КАЖДОМ ходе против ~199 у короткого блока «состав базы».
  #    Платит история диалога: длинные переписки теряют свои ранние ходы раньше
  #    (тримминг считается от GIGACHAT_MODEL_CONTEXT_TOKENS).
  #  * Требует GET /api/vault/catalog — маршрут появился в бэкенде этого же
  #    релиза. Старый образ бэкенда + этот ключ = головного блока НЕТ ВООБЩЕ.
  #  * Если каталог недоступен, головной блок исчезает молча: ни дерева, ни
  #    короткого блока (определение «что считать документом» тоже берётся из
  #    каталога). Это сделано намеренно — врать о составе базы хуже, чем
  #    молчать, — но означает, что проблема бэкенда выглядит как просто более
  #    скупой ответ, а не как ошибка. Смотреть логи UI: «не удалось отрисовать
  #    дерево разделов».
  # Правится из UI пользователем, поверх этого значения.
  RAG_CORPUS_TREE_ENABLED: "true"
  # Волна 3: ширина ретрива 20 → 40. Грейдер батчится по 12, поэтому 40 кандидатов
  # дают ЧЕТЫРЕ вызова оценки вместо двух (~x2 к стоимости этапа, латентность та же
  # — батчи идут одной параллельной волной). Правится из UI, если нужно вернуть 20.
  RAG_RERANK_CANDIDATES: "40"

  # ── Источник Confluence ───────────────────────────────────────────────
  # В SERVER-режиме эти ключи ПЕРЕОПРЕДЕЛЯЮТ соединение поверх пользовательской
  # конфигурации Confluence (base_url / ca_path / verify_ssl); всё остальное —
  # способ авторизации, логин, корневая страница, расписание — остаётся за
  # пользователем и в env не выносится.
  #
  # Мастер-выключатель источника. "false" убирает раздел Confluence из UI и не
  # даёт стартовать фоновой синхронизации — так выключают интеграцию целиком.
  CONFLUENCE_ENABLED: "true"
  # Базовый адрес Confluence. Тот же хост должен быть в 07-serviceentry-egress.yaml,
  # иначе сайдкар Istio отклонит исходящий вызов.
  CONFLUENCE_BASE_URL: "https://confluence.sberbank.ru"
  # Сколько страниц тянуть параллельно на одну синхронизацию. Поднимать только
  # если Confluence держит нагрузку — сервер отвечает 429 на слишком частые
  # запросы, и тогда синхронизация встаёт целиком.
  CONFLUENCE_MAX_CONCURRENCY: "3"
  # Нижняя граница интервала АВТОсинхронизации, минуты. Пользователь может
  # выставить период чаще в своей конфигурации — планировщик всё равно не пойдёт
  # чаще этого значения. Защита от того, чтобы десяток пользователей не начал
  # долбить Confluence раз в минуту.
  CONFLUENCE_MIN_AUTO_INTERVAL_MIN: "30"
  # Фоновый планировщик автосинхронизации. В server-режиме он включён и без
  # этого ключа, задан явно, чтобы поведение не зависело от режима. "false" —
  # штатный способ оставить Confluence доступным, но только по кнопке «Обновить».
  CONFLUENCE_AUTO_SYNC_SCHEDULER: "true"
  # Проверка TLS сервера СНЯТА — временный режим, пока нет бандла внутреннего УЦ.
  CONFLUENCE_VERIFY_SSL: "false"
  #
  # CONFLUENCE_CA_PATH намеренно НЕ задан по умолчанию.
  # В старом cognivault-ui.yaml он стоял как "/certs/sber-ca.pem" — по этому пути
  # ничего не было смонтировано, ключ был мусором. Теперь бандл внутреннего УЦ
  # лежит в том же секрете cognivault-gigachat-certs ключом cacert.pem, то есть
  # доступен по /certs/cacert.pem (секрет уже смонтирован в /certs).
  # Чтобы включить проверку: раскомментировать строку ниже и поменять
  # CONFLUENCE_VERIFY_SSL выше на "true". Не включено по умолчанию — не проверено,
  # что этот бандл покрывает цепочку хоста Confluence.
  # CONFLUENCE_CA_PATH: "/certs/cacert.pem"
